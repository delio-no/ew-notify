name: CI/CD Windows Build

on:
  push:
    branches: [ main, master, tauri-windows ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, tauri-windows ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: cargo test --verbose

      - name: Build Tauri Application
        run: npm run tauri build

      - name: Prepare Release Artifacts & Generate Hashes
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts

          # 1. Installer (NSIS)
          $nsis = Get-ChildItem -Path src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue
          if ($nsis) {
            Copy-Item $nsis.FullName -Destination artifacts/
          }

          # 2. Portable bundle (exe + WinDivert files + template config)
          New-Item -ItemType Directory -Force -Path artifacts/ew_notify_portable
          Copy-Item src-tauri/target/release/ew_notify.exe artifacts/ew_notify_portable/
          Copy-Item src-tauri/windivert/WinDivert.dll artifacts/ew_notify_portable/
          Copy-Item src-tauri/windivert/WinDivert64.sys artifacts/ew_notify_portable/
          Copy-Item src-tauri/windivert/WinDivert32.sys artifacts/ew_notify_portable/
          Copy-Item config.json artifacts/ew_notify_portable/
          Copy-Item README.md artifacts/ew_notify_portable/

          Compress-Archive -Path artifacts/ew_notify_portable/* -DestinationPath artifacts/ew_notify_portable.zip -Force
          Remove-Item -Recurse -Force artifacts/ew_notify_portable

          # 3. Generate SHA256 hashes
          Set-Location artifacts
          $hashes = Get-ChildItem -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)"
          }
          $hashes | Out-File -Encoding utf8 SHA256SUMS.txt

          Write-Host "Generated SHA256 Checksums:"
          Get-Content SHA256SUMS.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ew-notify-windows
          path: artifacts/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
