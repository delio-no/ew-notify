name: CI/CD Windows Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: cargo test --verbose

      - name: Build Tauri Application
        run: npm run tauri build

      - name: Prepare Release Artifacts & Generate Hashes
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts

          # 1. Installer (NSIS)
          $nsis = Get-ChildItem -Path target/release/bundle/nsis/*.exe, src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) {
            Write-Host "Found NSIS installer: $($nsis.FullName)"
            Copy-Item $nsis.FullName -Destination artifacts/
          } else {
            Write-Error "NSIS installer was not found in release bundles!"
            exit 1
          }

          # 2. Standalone binary
          $exe = Get-ChildItem -Path target/release/ew_notify.exe, src-tauri/target/release/ew_notify.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) {
            Write-Host "Found executable: $($exe.FullName)"
            Copy-Item $exe.FullName -Destination artifacts/
          } else {
            Write-Error "ew_notify.exe was not found in target/release!"
            exit 1
          }

          # 3. Portable bundle (exe + WinDivert files + template config + README)
          New-Item -ItemType Directory -Force -Path artifacts/ew_notify_portable
          Copy-Item $exe.FullName artifacts/ew_notify_portable/
          Copy-Item src-tauri/windivert/WinDivert.dll artifacts/ew_notify_portable/
          Copy-Item src-tauri/windivert/WinDivert64.sys artifacts/ew_notify_portable/
          Copy-Item src-tauri/windivert/WinDivert32.sys artifacts/ew_notify_portable/
          Copy-Item config.json artifacts/ew_notify_portable/
          Copy-Item README.md artifacts/ew_notify_portable/

          Compress-Archive -Path artifacts/ew_notify_portable/* -DestinationPath artifacts/ew_notify_portable.zip -Force
          Remove-Item -Recurse -Force artifacts/ew_notify_portable

          # 4. Generate SHA256 hashes
          Set-Location artifacts
          $hashes = Get-ChildItem -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)"
          }
          $hashes | Out-File -Encoding utf8 SHA256SUMS.txt

          Write-Host "Generated SHA256 Checksums:"
          Get-Content SHA256SUMS.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ew-notify-windows
          path: artifacts/*

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag_name || 'v0.1.0' }}
          name: EndlessWar Notifier ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag_name || 'v0.1.0' }}
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
