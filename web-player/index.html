<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <title>EndlessWar Live Stream</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">

  <style>
    :root {
      --bg-dark: #090c14;
      --card-bg: rgba(18, 24, 38, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.4);
      --accent-hover: #4f46e5;
      --live-red: #ef4444;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
      --success: #22c55e;
      --warning: #f59e0b;
      --safe-bottom: env(safe-area-inset-bottom, 12px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(239, 68, 68, 0.04) 0%, transparent 40%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 16px max(16px, var(--safe-bottom));
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 4px 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
    }

    .brand-icon {
      font-size: 1.35rem;
      filter: drop-shadow(0 0 10px var(--accent-glow));
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
    }

    .status-badge.live {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .status-badge.live .status-dot {
      background: var(--live-red);
      box-shadow: 0 0 8px var(--live-red);
      animation: pulse 1.8s infinite;
    }

    .status-badge.connecting {
      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.4);
      color: #fde68a;
    }

    .status-badge.connecting .status-dot {
      background: var(--warning);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.7; }
    }

    main {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Player Container */
    .player-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px -15px rgba(0, 0, 0, 0.8),
                  0 0 0 1px var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* Central animated ripple for tap/click feedback */
    .center-action-ripple {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 15;
    }

    .center-action-ripple.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Central Play Button when Paused */
    .center-play-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      cursor: pointer;
      z-index: 12;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: auto;
    }

    .center-play-badge:hover {
      transform: translate(-50%, -50%) scale(1.08);
      background: rgba(99, 102, 241, 0.95);
      border-color: rgba(255, 255, 255, 0.45);
    }

    .center-play-badge:active {
      transform: translate(-50%, -50%) scale(0.94);
    }

    .status-badge.stopped {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }

    .status-badge.stopped .status-dot {
      background: var(--live-red);
      box-shadow: 0 0 6px var(--live-red);
    }

    /* Modern Video Player Overlay */
    .player-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px 16px;
      pointer-events: none;
      background: linear-gradient(
        180deg, 
        rgba(0, 0, 0, 0.75) 0%, 
        transparent 22%, 
        transparent 78%, 
        rgba(0, 0, 0, 0.85) 100%
      );
      opacity: 0;
      transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 5;
    }

    .player-container:hover .player-overlay,
    .player-overlay.visible {
      opacity: 1;
    }

    /* Top Bar */
    .overlay-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: auto;
      gap: 12px;
    }

    .stream-info-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
    }

    .live-pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--live-red);
      box-shadow: 0 0 6px var(--live-red);
      animation: pulse 1.6s infinite;
    }

    .stream-id-chip {
      background: rgba(99, 102, 241, 0.18);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 2px 7px;
      border-radius: 6px;
      font-family: ui-monospace, monospace;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .overlay-top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 9999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.2s ease;
      pointer-events: auto;
    }

    .icon-btn:hover {
      background: rgba(99, 102, 241, 0.75);
      border-color: var(--accent);
      transform: scale(1.05);
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    /* Invisible center tap layer */
    .overlay-center-tap {
      flex: 1;
      width: 100%;
      pointer-events: auto;
    }

    /* Bottom Control Bar - Sleek Floating Bar (YouTube/Twitch/Netflix style) */
    .overlay-bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 12px;
      padding: 6px 12px;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .controls-left,
    .controls-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-icon-btn {
      background: transparent;
      border: none;
      color: #f1f5f9;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s ease;
      pointer-events: auto;
    }

    .control-icon-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .control-icon-btn:active {
      transform: scale(0.9);
      background: rgba(99, 102, 241, 0.4);
    }

    /* Live pill badge */
    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #f87171;
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid rgba(239, 68, 68, 0.3);
      user-select: none;
    }

    .live-pill .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--live-red);
      box-shadow: 0 0 6px var(--live-red);
      animation: pulse 1.6s infinite;
    }

    /* Quality Chip */
    .quality-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-dim);
      padding: 4px 9px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .quality-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--success);
    }

    /* Placeholder View */
    .placeholder-view {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
      background: rgba(9, 12, 20, 0.94);
      z-index: 10;
      transition: opacity 0.35s ease;
    }

    .placeholder-view.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      border-top-color: var(--accent);
      animation: spin 0.9s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .placeholder-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: #f1f5f9;
    }

    .placeholder-subtitle {
      color: var(--text-dim);
      font-size: 0.85rem;
      max-width: 380px;
      line-height: 1.5;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 4px;
    }

    .primary-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 9px 18px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px var(--accent-glow);
      transition: all 0.2s ease;
    }

    .primary-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .primary-btn:active {
      transform: scale(0.96);
    }

    .glass-btn {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 9px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .glass-btn:active {
      transform: scale(0.96);
    }

    /* Metadata Card */
    .stream-meta-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 18px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .stream-id-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stream-id-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      font-weight: 600;
    }

    .stream-id-value {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1rem;
      color: #a5b4fc;
      background: rgba(99, 102, 241, 0.1);
      padding: 3px 9px;
      border-radius: 6px;
      border: 1px dashed rgba(99, 102, 241, 0.3);
    }

    .copy-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 3px;
      border-radius: 4px;
      transition: color 0.2s;
      display: flex;
      align-items: center;
    }

    .copy-btn:hover {
      color: var(--text-main);
    }

    .manual-connect {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 340px;
    }

    .manual-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 8px 12px;
      color: #fff;
      font-family: monospace;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .manual-input:focus {
      border-color: var(--accent);
    }

    /* Diagnostics Card (Collapsible Drawer) */
    .diagnostics-card {
      width: 100%;
      background: rgba(12, 17, 29, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .diagnostics-header {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-dim);
      background: rgba(255, 255, 255, 0.02);
      user-select: none;
    }

    .diagnostics-header:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.04);
    }

    .diagnostics-body {
      display: none;
      padding: 12px 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.78rem;
      max-height: 140px;
      overflow-y: auto;
      line-height: 1.5;
      color: #38bdf8;
    }

    .diagnostics-card.expanded .diagnostics-body {
      display: block;
    }

    .diagnostics-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .text-link-btn {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 0.75rem;
      padding: 2px 4px;
      border-radius: 4px;
    }

    .text-link-btn:hover {
      text-decoration: underline;
    }

    @media (max-width: 640px) {
      body {
        padding: 8px 10px max(14px, var(--safe-bottom));
      }
      .stream-meta-card {
        flex-direction: column;
        align-items: flex-start;
      }
      .manual-connect {
        max-width: 100%;
      }
      .overlay-bottom-bar {
        padding: 4px 8px;
        gap: 6px;
      }
      .quality-chip {
        display: none; /* Hide on small screens to prioritize buttons */
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-icon">🎮</span>
      <span>EndlessWar Live</span>
    </div>
    <div id="statusBadge" class="status-badge connecting">
      <span class="status-dot"></span>
      <span id="statusText">Подключение...</span>
    </div>
  </header>

  <main>
    <!-- Player Container -->
    <div class="player-container" id="playerContainer" onclick="handlePlayerClick(event)">
      <video id="videoPlayer" playsinline webkit-playsinline autoplay muted></video>

      <!-- Central Tap Ripple Animation -->
      <div class="center-action-ripple" id="centerRipple">
        <svg id="rippleIcon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </div>



      <!-- Center Play Button (visible when paused) -->
      <button class="center-play-badge" id="centerPlayBtn" onclick="togglePlay(event)" title="Воспроизвести">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>

      <!-- Loading / Connecting Placeholder -->
      <div id="placeholder" class="placeholder-view">
        <div id="loadingSpinner" class="spinner"></div>
        <h2 id="placeholderTitle" class="placeholder-title">Подключение к трансляции</h2>
        <p id="placeholderSubtitle" class="placeholder-subtitle">Ожидание P2P рукопожатия с хостом игры...</p>
        <div class="btn-row">
          <button id="playBtn" class="primary-btn" style="display: none;" onclick="forcePlayVideo(event)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            Запустить видео
          </button>
          <button id="retryBtn" class="glass-btn" style="display: none;" onclick="initConnection(event)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
            Повторить
          </button>
        </div>
      </div>

      <!-- Modern Player Overlay -->
      <div class="player-overlay" id="playerOverlay">
        <!-- Top Bar -->
        <div class="overlay-top-bar">
          <div class="stream-info-badge">
            <span class="live-pulse-dot"></span>
            <span>EndlessWar</span>
            <span class="stream-id-chip" id="overlayStreamChip" onclick="copyStreamId(event)">—</span>
          </div>

          <div class="overlay-top-actions">
            <button class="icon-btn" onclick="toggleDiagnostics(event)" title="Лог подключения">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="4 17 10 11 4 5"></polyline>
                <line x1="12" y1="19" x2="20" y2="19"></line>
              </svg>
            </button>
            <button class="icon-btn" onclick="initConnection(event)" title="Переподключиться">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Center tap target -->
        <div class="overlay-center-tap" onclick="handleCenterTap(event)"></div>

        <!-- Bottom Controls Bar (Twitch / YouTube style) -->
        <div class="overlay-bottom-bar">
          <div class="controls-left">
            <!-- Play / Pause Button -->
            <button class="control-icon-btn" id="playPauseBtn" onclick="togglePlay(event)" title="Воспроизведение / Пауза">
              <svg id="playPauseIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
              </svg>
            </button>



            <!-- Live Pill Indicator -->
            <div class="live-pill">
              <span class="live-dot"></span>
              <span>LIVE</span>
            </div>
          </div>

          <div class="controls-right">
            <!-- Quality Badge -->
            <div class="quality-chip">
              <span class="quality-dot"></span>
              <span id="qualityBadgeText">720p 30fps</span>
            </div>

            <!-- Picture-in-Picture Button -->
            <button class="control-icon-btn" id="pipBtn" onclick="togglePiP(event)" title="Картинка в картинке">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 11h-8v6h8v-6zm4 8V4.98C23 3.88 22.1 3 21 3H3c-1.1 0-2 .88-2 1.98V19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H3V4.97h18v14.05z"/>
              </svg>
            </button>

            <!-- Fullscreen Button -->
            <button class="control-icon-btn" id="fsBtn" onclick="toggleFullscreen(event)" title="Во весь экран">
              <svg id="fsIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Metadata Card -->
    <div class="stream-meta-card">
      <div class="stream-id-group">
        <div class="stream-id-label">Идентификатор трансляции</div>
        <div class="stream-id-value">
          <span id="currentStreamId">—</span>
          <button class="copy-btn" onclick="copyStreamId()" title="Скопировать ID">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>
      </div>

      <div class="manual-connect">
        <input type="text" id="streamInput" class="manual-input" placeholder="ew-abc123" />
        <button class="primary-btn" onclick="onManualConnect()">Смотреть</button>
      </div>
    </div>

    <!-- Collapsible Diagnostics Card -->
    <div class="diagnostics-card" id="diagnosticsCard">
      <div class="diagnostics-header" onclick="toggleDiagnostics(event)">
        <span>⚡ Диагностика соединения WebRTC / ICE</span>
        <div class="diagnostics-actions">
          <button class="text-link-btn" onclick="clearLog(event)">Очистить</button>
          <span id="diagnosticsChevron">▾</span>
        </div>
      </div>
      <div class="diagnostics-body" id="debugLog">Ожидание запуска...</div>
    </div>
  </main>

  <script>
    let pc = null;
    let mqttClient = null;
    let targetStreamId = '';
    let viewerId = '';
    let isConnectedToHost = false;
    let mediaStreamObj = null;

    const MQTT_BROKERS = [
      'wss://broker.emqx.io:8084/mqtt',
      'wss://broker.hivemq.com:8884/mqtt'
    ];
    let brokerIndex = 0;

    const video = document.getElementById('videoPlayer');
    const placeholder = document.getElementById('placeholder');
    const placeholderTitle = document.getElementById('placeholderTitle');
    const placeholderSubtitle = document.getElementById('placeholderSubtitle');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const playBtn = document.getElementById('playBtn');
    const retryBtn = document.getElementById('retryBtn');
    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const currentStreamIdEl = document.getElementById('currentStreamId');
    const overlayStreamChip = document.getElementById('overlayStreamChip');
    const streamInput = document.getElementById('streamInput');
    const centerRipple = document.getElementById('centerRipple');
    const rippleIcon = document.getElementById('rippleIcon');
    const playPauseIcon = document.getElementById('playPauseIcon');
    const centerPlayBtn = document.getElementById('centerPlayBtn');
    const fsIcon = document.getElementById('fsIcon');

    // SVG icon templates
    const ICONS = {
      play: '<path d="M8 5v14l11-7z"/>',
      pause: '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>',
      fsEnter: '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>',
      fsExit: '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>'
    };

    function parseStreamIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('s') || params.get('id') || '';
    }

    function setStatus(state, message) {
      statusBadge.className = 'status-badge ' + state;
      statusText.innerText = message;
    }

    let overlayTimeout = null;
    function showControlsBriefly(duration = 3500) {
      const overlay = document.getElementById('playerOverlay');
      if (!overlay) return;
      overlay.classList.add('visible');
      if (overlayTimeout) clearTimeout(overlayTimeout);
      overlayTimeout = setTimeout(() => {
        overlay.classList.remove('visible');
      }, duration);
    }

    function onStreamPlaying() {
      if (!placeholder.classList.contains('hidden')) {
        placeholder.classList.add('hidden');
        loadingSpinner.style.display = 'none';
        playBtn.style.display = 'none';
        retryBtn.style.display = 'none';
        setStatus('live', 'В ЭФИРЕ');
      }
      if (playPauseIcon) playPauseIcon.innerHTML = ICONS.pause;
      if (centerPlayBtn) centerPlayBtn.style.display = 'none';
      showControlsBriefly(3000);
    }

    function handleStreamEnded(reason) {
      log('Трансляция остановлена: ' + (reason || 'Хост остановил стрим'), '#f59e0b');
      setStatus('stopped', 'ОСТАНОВЛЕНО');
      placeholder.classList.remove('hidden');
      loadingSpinner.style.display = 'none';
      playBtn.style.display = 'none';
      retryBtn.style.display = 'inline-flex';
      placeholderTitle.innerText = '🛑 Трансляция завершена';
      placeholderSubtitle.innerText = reason || 'Хост остановил стрим через Telegram-бота или приложение ew-notify было закрыто.';
      if (video) {
        try { video.pause(); } catch(e) {}
        video.srcObject = null;
      }
      if (centerPlayBtn) centerPlayBtn.style.display = 'none';
      cleanupCurrentConnection();
    }

    // Bind all video events to show stream as soon as first frame arrives
    video.addEventListener('loadeddata', onStreamPlaying);
    video.addEventListener('loadedmetadata', onStreamPlaying);
    video.addEventListener('canplay', onStreamPlaying);
    video.addEventListener('playing', onStreamPlaying);
    video.addEventListener('resize', () => {
      if (video.videoWidth > 0) onStreamPlaying();
    });
    video.addEventListener('timeupdate', () => {
      if (video.currentTime > 0) onStreamPlaying();
    });

    function showError(title, subtitle) {
      placeholder.classList.remove('hidden');
      loadingSpinner.style.display = 'none';
      playBtn.style.display = 'none';
      retryBtn.style.display = 'inline-flex';
      placeholderTitle.innerText = title;
      placeholderSubtitle.innerText = subtitle;
    }

    function triggerHaptic() {
      if (window.Telegram?.WebApp?.HapticFeedback) {
        try {
          window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
        } catch(e) {}
      }
    }

    function showCenterRipple(isPlay) {
      if (!centerRipple || !rippleIcon) return;
      rippleIcon.innerHTML = isPlay ? ICONS.play : ICONS.pause;
      centerRipple.classList.add('show');
      setTimeout(() => {
        centerRipple.classList.remove('show');
      }, 400);
    }

    function handlePlayerClick(e) {
      if (!placeholder.classList.contains('hidden') && isConnectedToHost) {
        forcePlayVideo(e);
        return;
      }
      const overlay = document.getElementById('playerOverlay');
      if (overlay) {
        const isVisible = overlay.classList.contains('visible');
        if (isVisible) {
          overlay.classList.remove('visible');
          if (overlayTimeout) clearTimeout(overlayTimeout);
        } else {
          showControlsBriefly(4000);
        }
      }
    }

    function handleCenterTap(e) {
      if (e) e.stopPropagation();
      // Center tap toggles overlay controls visibility, NEVER pauses the live stream!
      handlePlayerClick(e);
    }

    function forcePlayVideo(e) {
      if (e) e.stopPropagation();
      video.muted = true;
      if ((!video.srcObject || (video.srcObject.getVideoTracks && video.srcObject.getVideoTracks().length === 0)) && pc) {
        const receivers = pc.getReceivers ? pc.getReceivers() : [];
        for (const r of receivers) {
          if (r.track && r.track.kind === 'video') {
            console.log('Force play: binding track to video.srcObject');
            video.srcObject = new MediaStream([r.track]);
            break;
          }
        }
      }
      video.play().then(() => {
        onStreamPlaying();
      }).catch(err => {
        console.warn('Manual play failed:', err);
      });
    }

    function togglePlay(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      triggerHaptic();
      if (!video) return;

      if (video.paused) {
        if (!video.srcObject && pc) {
          const receivers = pc.getReceivers ? pc.getReceivers() : [];
          for (const r of receivers) {
            if (r.track && r.track.kind === 'video') {
              video.srcObject = new MediaStream([r.track]);
              break;
            }
          }
        }
        video.play().then(() => {
          onStreamPlaying();
        }).catch(console.warn);
        if (playPauseIcon) playPauseIcon.innerHTML = ICONS.pause;
        if (centerPlayBtn) centerPlayBtn.style.display = 'none';
        showCenterRipple(true);
      } else {
        video.pause();
        if (playPauseIcon) playPauseIcon.innerHTML = ICONS.play;
        if (centerPlayBtn) centerPlayBtn.style.display = 'flex';
        showCenterRipple(false);
      }
      showControlsBriefly(3500);
    }

    // Keyboard shortcuts for power users (desktop)
    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.code === 'Space' || e.key === 'k') {
        e.preventDefault();
        togglePlay(e);
      } else if (e.key === 'f') {
        e.preventDefault();
        toggleFullscreen(e);
      } else if (e.key === 'd') {
        e.preventDefault();
        toggleDiagnostics(e);
      }
    });

    function toggleFullscreen(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      triggerHaptic();
      const container = document.getElementById('playerContainer');

      if (document.fullscreenElement || document.webkitFullscreenElement) {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
        if (fsIcon) fsIcon.innerHTML = ICONS.fsEnter;
      } else {
        if (container.requestFullscreen) {
          container.requestFullscreen().then(() => {
            if (fsIcon) fsIcon.innerHTML = ICONS.fsExit;
          }).catch(() => {
            if (video && video.webkitEnterFullscreen) video.webkitEnterFullscreen();
          });
        } else if (container.webkitRequestFullscreen) {
          container.webkitRequestFullscreen();
          if (fsIcon) fsIcon.innerHTML = ICONS.fsExit;
        } else if (video && video.webkitEnterFullscreen) {
          // iOS Safari iPhone
          video.webkitEnterFullscreen();
        }
      }
      showControlsBriefly(3000);
    }

    document.addEventListener('fullscreenchange', () => {
      if (fsIcon) {
        fsIcon.innerHTML = document.fullscreenElement ? ICONS.fsExit : ICONS.fsEnter;
      }
    });
    document.addEventListener('webkitfullscreenchange', () => {
      if (fsIcon) {
        fsIcon.innerHTML = document.webkitFullscreenElement ? ICONS.fsExit : ICONS.fsEnter;
      }
    });

    function togglePiP(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      triggerHaptic();
      if (!video) return;

      if (document.pictureInPictureElement) {
        document.exitPictureInPicture?.().catch(() => {});
      } else if (video.requestPictureInPicture) {
        video.requestPictureInPicture().catch((err) => {
          log('PiP ошибка: ' + err.message, '#f59e0b');
        });
      } else if (video.webkitSetPresentationMode && typeof video.webkitSetPresentationMode === 'function') {
        const mode = video.webkitPresentationMode === 'picture-in-picture' ? 'inline' : 'picture-in-picture';
        video.webkitSetPresentationMode(mode);
      } else {
        alert('Режим «Картинка в картинке» не поддерживается вашим браузером');
      }
      showControlsBriefly(3000);
    }

    function toggleDiagnostics(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      triggerHaptic();
      const card = document.getElementById('diagnosticsCard');
      const chevron = document.getElementById('diagnosticsChevron');
      if (card) {
        card.classList.toggle('expanded');
        if (chevron) {
          chevron.innerText = card.classList.contains('expanded') ? '▴' : '▾';
        }
      }
    }

    function clearLog(e) {
      if (e) e.stopPropagation();
      const el = document.getElementById('debugLog');
      if (el) el.innerHTML = '';
    }

    function log(msg, color) {
      console.log(msg);
      const el = document.getElementById('debugLog');
      if (el) {
        const time = new Date().toLocaleTimeString();
        const style = color ? ` style="color: ${color};"` : '';
        el.innerHTML += `<div${style}>[${time}] ${msg}</div>`;
        el.scrollTop = el.scrollHeight;
      }
    }

    window.addEventListener('error', (e) => { if (e.message && e.message !== 'Script error.') log('JS Error: ' + e.message, '#ef4444'); });
    window.addEventListener('unhandledrejection', (e) => log('Promise Error: ' + (e.reason ? (e.reason.message || e.reason) : e), '#ef4444'));

    let activeMqttClients = [];
    let activeEventSources = [];
    let activeSockets = [];

    function cleanupCurrentConnection() {
      if (pc) {
        try { pc.close(); } catch(e) {}
        pc = null;
      }
      activeEventSources.forEach((s) => {
        try { s.close(); } catch(e) {}
      });
      activeEventSources = [];
      activeSockets.forEach((s) => {
        try { s.close(); } catch(e) {}
      });
      activeSockets = [];
      activeMqttClients.forEach((c) => {
        try { c.end(true); } catch(e) {}
      });
      activeMqttClients = [];
      mqttClient = null;
      isConnectedToHost = false;
      mediaStreamObj = null;
    }

    async function initConnection(e) {
      if (e) e.stopPropagation();
      triggerHaptic();
      cleanupCurrentConnection();

      if (!targetStreamId) {
        setStatus('', 'Ожидание ID');
        showError('Укажите ID трансляции', 'Введите идентификатор окна в поле ниже или откройте ссылку из бота.');
        return;
      }

      currentStreamIdEl.innerText = targetStreamId;
      overlayStreamChip.innerText = targetStreamId;
      streamInput.value = targetStreamId;

      setStatus('connecting', 'Подключение...');
      placeholder.classList.remove('hidden');
      loadingSpinner.style.display = 'block';
      playBtn.style.display = 'none';
      retryBtn.style.display = 'none';
      placeholderTitle.innerText = 'Установка P2P соединения...';
      placeholderSubtitle.innerText = 'Связь с хостом ' + targetStreamId;

      viewerId = 'v-' + Math.random().toString(36).substring(2, 10);
      const answerTopic = `ew-notify/${targetStreamId}/answer/${viewerId}`;
      const offerTopic = `ew-notify/${targetStreamId}/offer`;
      const cleanStreamId = targetStreamId.replace(/^ew-/, "");
      const ntfyOfferUrl = `https://ntfy.sh/ew-${cleanStreamId}-off`;
      const ntfyAnswerSseUrl = `https://ntfy.sh/ew-${cleanStreamId}-ans-${viewerId}/sse`;
      const ntfyAnswerWsUrl = `wss://ntfy.sh/ew-${cleanStreamId}-ans-${viewerId}/ws`;

      async function parseNtfyPayload(data) {
        if (!data || data.event !== 'message') return null;
        let text = data.message;
        if (data.attachment && data.attachment.url) {
          try {
            const resp = await fetch(data.attachment.url);
            text = await resp.text();
          } catch(e) {}
        }
        if (!text) return null;
        try {
          return JSON.parse(text);
        } catch(e) {
          return null;
        }
      }

      let isOfferReady = false;
      let connectedBrokerClient = null;
      let hasReceivedAnswer = false;
      let hasPublishedOffer = false;

      log('Старт сессии: ' + targetStreamId + ' (ID: ' + viewerId + ')');

      async function handleRemoteAnswer(sdpStr, channelName) {
        if (hasReceivedAnswer || !pc || pc.signalingState === 'closed') return;
        hasReceivedAnswer = true;
        log('Получен ANSWER от хоста (' + channelName + ')! Размер SDP: ' + sdpStr.length, '#22c55e');
        setStatus('connecting', 'P2P рукопожатие...');
        placeholderTitle.innerText = 'Хост ответил!';
        placeholderSubtitle.innerText = 'Установка медиа-канала WebRTC...';

        try {
          await pc.setRemoteDescription(new RTCSessionDescription({
            type: 'answer',
            sdp: sdpStr,
          }));
          log('Remote SDP применен успешно!');
        } catch (e) {
          log('Ошибка применения SDP: ' + e.message, '#ef4444');
        }
      }

      function tryPublishOffer() {
        if (!isOfferReady || !pc || !pc.localDescription || hasReceivedAnswer) {
          return;
        }

        const offerPayload = JSON.stringify({
          viewer_id: viewerId,
          sdp: pc.localDescription.sdp,
        });

        // 1. Primary Signaling via HTTPS/Port 443 (ntfy.sh) - send ONCE
        if (!hasPublishedOffer) {
          hasPublishedOffer = true;
          log('Отправка WebRTC OFFER по каналу HTTPS/443 (ntfy.sh)...');
          fetch(ntfyOfferUrl, {
            method: 'POST',
            body: offerPayload,
          })
          .then(async (res) => {
            if (res.ok) {
              log('OFFER успешно доставлен (HTTPS/443)! Ждём ответ игры...', '#22c55e');
            } else {
              log('ntfy.sh вернул HTTP статус: ' + res.status + ', пробуем fallback...', '#f59e0b');
            }
          })
          .catch((err) => {
            log('Ошибка отправки OFFER по HTTPS/443: ' + err.message, '#f59e0b');
          });
        }

        // 2. Secondary Signaling via MQTT Brokers - only if we haven't received answer yet
        if (connectedBrokerClient && !hasReceivedAnswer) {
          log('Отправка WebRTC OFFER в MQTT топик...');
          connectedBrokerClient.publish(offerTopic, offerPayload, { qos: 1 }, (err) => {
            if (err) {
              log('Ошибка публикации OFFER в MQTT: ' + err.message, '#f59e0b');
            } else {
              log('OFFER успешно опубликован в MQTT топик!', '#22c55e');
            }
          });
        }
      }

      // Channel 1: HTTPS/443 Server-Sent Events (SSE) via ntfy.sh
      try {
        log('Подключение к каналу HTTPS/443 (ntfy.sh)...');
        const sse = new EventSource(ntfyAnswerSseUrl);
        activeEventSources.push(sse);

        sse.onopen = () => {
          log('Канал HTTPS/443 (SSE) готов к приёму ответа');
        };

        sse.onmessage = async (e) => {
          const parsed = await parseNtfyPayload(JSON.parse(e.data));
          if (parsed) {
            if (parsed.event === 'stream_stopped') {
              handleStreamEnded(parsed.message || 'Хост остановил стрим в Telegram-боте.');
            } else if (parsed.sdp) {
              handleRemoteAnswer(parsed.sdp, 'HTTPS/443 SSE');
            }
          }
        };

        sse.onerror = () => {
          log('Канал SSE временно недоступен, fallback на WSS/443', '#f59e0b');
        };
      } catch(e) {
        log('Ошибка инициализации SSE: ' + e.message, '#f59e0b');
      }

      // Channel 2: WSS/443 WebSocket via ntfy.sh
      try {
        const ws = new WebSocket(ntfyAnswerWsUrl);
        activeSockets.push(ws);
        ws.onopen = () => {
          log('Канал WSS/443 подключен');
        };
        ws.onmessage = async (e) => {
          try {
            const parsed = await parseNtfyPayload(JSON.parse(e.data));
            if (parsed) {
              if (parsed.event === 'stream_stopped') {
                handleStreamEnded(parsed.message || 'Хост остановил стрим в Telegram-боте.');
              } else if (parsed.sdp) {
                handleRemoteAnswer(parsed.sdp, 'WSS/443');
              }
            }
          } catch(err) {}
        };
      } catch(e) {}

      // Channel 3: Secondary MQTT signaling
      try {
        const brokerUrl = MQTT_BROKERS[brokerIndex % MQTT_BROKERS.length];
        brokerIndex++;
        const client = mqtt.connect(brokerUrl, {
          clientId: viewerId,
          clean: true,
          connectTimeout: 4000,
          reconnectPeriod: 3000,
        });
        activeMqttClients.push(client);

        client.on('connect', () => {
          log('MQTT брокер подключен (' + brokerUrl + ')');
          client.subscribe(answerTopic, { qos: 1 });
          connectedBrokerClient = client;
          tryPublishOffer();
        });

        client.on('message', (topic, message) => {
          if (topic === answerTopic) {
            try {
              const data = JSON.parse(message.toString());
              if (data.event === 'stream_stopped') {
                handleStreamEnded(data.message || 'Хост остановил стрим в Telegram-боте.');
              } else if (data.sdp) {
                handleRemoteAnswer(data.sdp, 'MQTT');
              }
            } catch(e) {}
          }
        });
      } catch(e) {}

      // Configure WebRTC PeerConnection with STUN & default Metered Europe TURN Relay
      try {
        log('Инициализация RTCPeerConnection...');
        const params = new URLSearchParams(window.location.search);
        const iceServers = [
          { urls: 'stun:stun.relay.metered.ca:80' },
          { urls: 'stun:stun.cloudflare.com:3478' },
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:global.stun.twilio.com:3478' }
        ];
        const customTurn = params.get('turn') || localStorage.getItem('ew_turn_server');
        if (customTurn) {
          const urls = customTurn.split(',').map(u => {
            let s = u.trim();
            if (s && !s.startsWith('turn:') && !s.startsWith('turns:')) {
              s = 'turn:' + s;
            }
            return s;
          }).filter(Boolean);
          const turnUser = params.get('tu') || localStorage.getItem('ew_turn_user') || '';
          const turnPass = params.get('tp') || localStorage.getItem('ew_turn_pass') || '';
          if (urls.length > 0) {
            iceServers.push({
              urls: urls.length === 1 ? urls[0] : urls,
              username: turnUser,
              credential: turnPass
            });
            log('TURN relay настроен (пользовательский): ' + urls.join(', '), '#22c55e');
          }
        } else {
          // Default Metered Europe TURN Relay for zero-config cellular / 4G streaming
          iceServers.push({
            urls: [
              'turn:europe.relay.metered.ca:80',
              'turn:europe.relay.metered.ca:80?transport=tcp',
              'turn:europe.relay.metered.ca:443',
              'turns:europe.relay.metered.ca:443?transport=tcp'
            ],
            username: '6fbdfa7d7d5d7cce7d536a5d',
            credential: 'UncX8C2HkcMJ5lCN'
          });
          log('Резервный TURN relay (Metered Europe) готов', '#94a3b8');
        }

        pc = new RTCPeerConnection({ iceServers });
        video.muted = true;

        pc.ontrack = (event) => {
          log('Получен медиа-трек: ' + event.track.kind, '#22c55e');
          const stream = (event.streams && event.streams[0]) ? event.streams[0] : new MediaStream([event.track]);
          video.srcObject = stream;
          video.muted = true;

          video.play().then(() => {
            onStreamPlaying();
          }).catch(err => {
            console.warn('Autoplay blocked:', err);
            loadingSpinner.style.display = 'none';
            playBtn.style.display = 'inline-flex';
            retryBtn.style.display = 'inline-flex';
            placeholderTitle.innerText = 'Видео готово к просмотру';
            placeholderSubtitle.innerText = 'Нажмите кнопку ниже, чтобы начать воспроизведение.';
          });
        };

        pc.oniceconnectionstatechange = () => {
          log('ICE State: ' + pc.iceConnectionState);
          if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
            isConnectedToHost = true;
            onStreamPlaying();
          } else if (pc.iceConnectionState === 'failed') {
            showError('Сбой P2P соединения', 'Не удалось связаться с ПК напрямую через UDP. Попробуйте еще раз.');
          }
        };

        pc.onconnectionstatechange = () => {
          log('WebRTC Connection State: ' + pc.connectionState);
          if (pc.connectionState === 'connected') {
            isConnectedToHost = true;
            onStreamPlaying();
          } else if (pc.connectionState === 'closed') {
            handleStreamEnded('Хост остановил стрим или закрыл приложение ew-notify.');
          } else if (pc.connectionState === 'failed') {
            handleStreamEnded('Соединение с хостом разорвано (окно закрыто или хост отключился).');
          } else if (pc.connectionState === 'disconnected') {
            log('Временный разрыв соединения, ожидание...', '#f59e0b');
            setTimeout(() => {
              if (pc && pc.connectionState === 'disconnected') {
                handleStreamEnded('Хост отключился или трансляция была прервана.');
              }
            }, 6000);
          }
        };

        pc.onicecandidate = (event) => {
          if (event.candidate) {
            const cand = event.candidate;
            const addr = cand.address || cand.ip || '';
            const port = cand.port ? (':' + cand.port) : '';
            log('ICE кандидат: ' + cand.type + ' ' + (cand.protocol || 'udp') + (addr ? (' (' + addr + port + ')') : ''));
          } else {
            log('ICE сбор кандидатов завершен');
          }
        };

        try {
          const tr = pc.addTransceiver('video', { direction: 'recvonly' });
          if (typeof RTCRtpReceiver !== 'undefined' && RTCRtpReceiver.getCapabilities) {
            const caps = RTCRtpReceiver.getCapabilities('video');
            if (caps && caps.codecs) {
              const h264 = caps.codecs.filter(c => c.mimeType && c.mimeType.toLowerCase() === 'video/h264');
              if (h264.length > 0 && tr.setCodecPreferences) {
                tr.setCodecPreferences(h264);
                log('H.264 кодек выбран (SDP оптимизирован)', '#22c55e');
              }
            }
          }
        } catch(e) {
          log('addTransceiver: ' + e.message);
        }

        const offer = await pc.createOffer({ offerToReceiveVideo: true });
        await pc.setLocalDescription(offer);
        log('Локальный OFFER создан, ожидание ICE...');

        await new Promise((resolve) => {
          if (pc.iceGatheringState === 'complete') {
            resolve();
            return;
          }
          let resolved = false;
          let timer = null;
          const done = () => {
            if (!resolved) {
              resolved = true;
              if (timer) clearTimeout(timer);
              resolve();
            }
          };
          const check = () => {
            if (pc.iceGatheringState === 'complete') done();
          };
          pc.addEventListener('icegatheringstatechange', check);
          // Wait up to 2000ms on mobile connections to ensure relay / srflx candidates are gathered
          timer = setTimeout(done, 2000);
        });

        isOfferReady = true;
        tryPublishOffer();
      } catch (err) {
        log('Критическая ошибка WebRTC: ' + err.message, '#ef4444');
      }

      // 15 seconds watchdog check
      setTimeout(() => {
        if (!placeholder.classList.contains('hidden')) {
          if (isConnectedToHost) {
            loadingSpinner.style.display = 'none';
            playBtn.style.display = 'inline-flex';
            retryBtn.style.display = 'inline-flex';
            placeholderTitle.innerText = 'Видеопоток ожидается';
            placeholderSubtitle.innerText = 'P2P соединение установлено. Убедитесь, что окно игры развернуто на ПК, или нажмите кнопку ниже.';
          } else {
            showError('Хост не отвечает', 'Убедитесь, что в Telegram-боте нажат «📺 Стрим», выбрано окно игры и открыта самая свежая ссылка из бота.');
          }
        }
      }, 15000);
    }

    function onManualConnect() {
      const inputVal = streamInput.value.trim();
      if (!inputVal) return;
      targetStreamId = inputVal;
      const url = new URL(window.location);
      url.searchParams.set('s', targetStreamId);
      window.history.replaceState({}, '', url);
      initConnection();
    }

    function copyStreamId(e) {
      if (e) e.stopPropagation();
      if (!targetStreamId) return;
      triggerHaptic();
      navigator.clipboard.writeText(targetStreamId).then(() => {
        alert('ID стрима скопирован: ' + targetStreamId);
      });
    }

    // Auto-init on page load with Telegram WebApp support
    window.addEventListener('DOMContentLoaded', () => {
      if (window.Telegram && window.Telegram.WebApp) {
        try {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
        } catch(e) {}
      }
      targetStreamId = parseStreamIdFromUrl();
      initConnection();
    });
  </script>
  <!-- MQTT.js library for fallback signaling -->
  <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
</body>
